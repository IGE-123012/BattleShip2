name: Publicar Imagem no Docker Hub

on:
  push:
    branches: [ "main" ] # Executa sempre que fizeres push para a main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o ambiente Java (JDK 21)
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila o projeto e gera o .jar ignorando os testes (tal como fizeste localmente)
      - name: Compilar com o Maven (Skip Tests)
        run: mvn clean package -DskipTests

      # 4. Faz login na tua conta do Docker Hub usando os Secrets criados
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Cria a imagem Docker e envia-a automaticamente para o Docker Hub
      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Substitui 'o-teu-utilizador-docker' pelo teu nome de utilizador real do Docker Hub
          tags: mcfvs/battleship-game:latest